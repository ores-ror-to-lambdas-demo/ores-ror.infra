name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embedded-rails-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: infra }
      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.rb
          path: app
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-25.0.0
          bundler-cache: false
          working-directory: app
      - name: Install Rails gems for embedded TruffleRuby
        working-directory: app
        run: BUNDLE_PATH=vendor/bundle-truffleruby bundle install --jobs 4 --retry 3
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '21'
          cache: maven
      - name: Build and test 2-cell / 6-worker cluster
        run: mvn -f infra/pom.xml -Dapp.root="$GITHUB_WORKSPACE/app" test
      - name: Package runnable supervisor
        run: mvn -f infra/pom.xml -DskipTests package
      - name: Boot real Graal Rails cluster and smoke HTTP
        env:
          APP_ROOT: ${{ github.workspace }}/app
          PORT: '3200'
          MIN_ISOLATES: '2'
          MAX_ISOLATES: '3'
          ISOLATE_MAX_CONCURRENCY: '3'
          DATA_API_URL: http://127.0.0.1:8787/v1
        run: |
          java -jar infra/target/ores-ror-infra-0.3.0.jar >graal-cluster.log 2>&1 &
          echo $! > graal.pid
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3200/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q 'truffleruby-graal' health.json
          seq 1 24 | xargs -P 12 -I{} curl --fail --silent -H 'x-request-id: smoke-{}' http://127.0.0.1:3200/healthz >/dev/null
          kill $(cat graal.pid)
      - name: Show cluster log on failure
        if: failure()
        run: cat graal-cluster.log || true

  ruby-native-isolate-upstream-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Prove Ruby native-isolate artifact is not published yet
        run: |
          if mvn -q dependency:get -Dartifact=org.graalvm.polyglot:ruby-isolate-linux-amd64-community:25.1.3:pom; then
            echo 'Ruby native isolate artifact now exists; enable spawnIsolate(true) and remove this blocker assertion.'
            exit 1
          fi
          echo 'Expected upstream gap confirmed: Ruby is not yet a published polyglot native-isolate language.'
