name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  runtime-assets-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: infra
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ores-ror-to-lambdas-demo/ores-ror.rb
          ref: 09336b59f07332af995e9b586bac10cd4242df2b
          path: app
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
          working-directory: app

      - name: Prove runtime adapters live only in infra
        run: |
          test -f infra/graal/bootstrap.rb
          test -f infra/graal/graal-show.json
          test -f infra/aws-lambda/Dockerfile
          test -f infra/aws-lambda/adapter.rb
          test -f infra/aws-lambda/runtime.rb
          test -f infra/aws-lambda/bootstrap
          test ! -e app/graal
          test ! -e app/aws-lambda
          grep -qx '.bundle' app/.dockerignore

      - name: Generate Rails-free Graal units using infra-owned bootstrap
        working-directory: app
        env:
          ORES_BUILD_TARGET: graal
          ORES_INFRA_ROOT: ${{ github.workspace }}/infra
        run: |
          truffleruby bin/build-runtime
          test -f generated/graal/manifest.json
          test -f generated/graal/routes/users/'[id]'/_get/handler.rb
          grep -Fq '# --- infra graal/bootstrap.rb ---' generated/graal/routes/users/'[id]'/_get/handler.rb
          ! grep -R -E 'config/environment|Rails\.application|ActionController|ActionView' generated/graal
          ! grep -R -F 'require "json"' generated/graal

      - name: Re-run full Rails-vs-Graal route and middleware parity
        working-directory: app
        env:
          ORES_INFRA_ROOT: ${{ github.workspace }}/infra
        run: |
          RAILS_ENV=test ORES_BUILD_TARGET=rails bundle exec rails runner script/rails-contract-export.rb /tmp/rails-contract.json
          ORES_BUILD_TARGET=graal truffleruby script/graal-contract-export.rb /tmp/graal-contract.json
          diff -u /tmp/rails-contract.json /tmp/graal-contract.json
          ruby -rjson -e 'rows=JSON.parse(File.read("/tmp/rails-contract.json")); raise unless rows.map{|r|r.fetch("name")}.uniq.size >= 15; raise unless rows.size == 30'

      - name: Build Lambda image from app + infra contexts
        run: |
          docker build \
            --platform linux/amd64 \
            --build-context ores_infra=infra \
            -f infra/aws-lambda/Dockerfile \
            -t ores-ror-truffleruby-lambda:infra-split \
            app

      - name: Verify Lambda image and invoke health through RIE
        run: |
          docker run --rm --entrypoint truffleruby ores-ror-truffleruby-lambda:infra-split -e 'abort "rails gem present" unless Gem::Specification.find_all_by_name("rails").empty?'
          curl --fail --location --retry 3 --output aws-lambda-rie https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/download/v1.37/aws-lambda-rie
          echo '6b1e686e62ab2baf5759c412c4864276ef2a88b094fca53ec070637ccba9b9a5  aws-lambda-rie' | sha256sum -c -
          chmod +x aws-lambda-rie
          docker run --rm -d --name ores-ror-infra-lambda -p 9000:8080 \
            -v "$PWD/aws-lambda-rie:/aws-lambda-rie:ro" \
            --entrypoint /aws-lambda-rie ores-ror-truffleruby-lambda:infra-split /var/runtime/bootstrap
          for n in $(seq 1 60); do
            if curl --fail --silent -H 'content-type: application/json' \
              -d @infra/aws-lambda/event-v2.json \
              http://127.0.0.1:9000/2015-03-31/functions/function/invocations >lambda-response.json; then
              break
            fi
            sleep 1
          done
          cat lambda-response.json
          grep -q '"statusCode":200' lambda-response.json
          grep -Fq '"x-ores-execution-mode":"lambda"' lambda-response.json
          grep -q '"x-ores-runtime":"truffleruby"' lambda-response.json
      - if: failure()
        run: docker logs ores-ror-infra-lambda || true
      - if: always()
        run: docker rm -f ores-ror-infra-lambda >/dev/null 2>&1 || true

  java-supervisor-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: '21'
          cache: maven
      - name: Compile/package supervisor without the obsolete embedded-Rails smoke
        run: mvn -DskipTests package

  graal-worker-cluster-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ores-ror-to-lambdas-demo/ores-ror.rb
          ref: 09336b59f07332af995e9b586bac10cd4242df2b
          path: app
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Generate Rails-free route/group Graal units
        working-directory: app
        env:
          ORES_BUILD_TARGET: graal
          ORES_INFRA_ROOT: ${{ github.workspace }}
        run: ruby bin/build-runtime
      - name: Assert one-context-per-isolate manifest
        run: |
          grep -Fq '"schema": "ores-graal-ruby-manifest/v4"' app/generated/graal/manifest.json
          grep -Fq '"context_model": "one-long-lived-context-per-route-or-group-isolate"' app/generated/graal/manifest.json
          grep -Fq '"contexts_per_isolate": 1' app/generated/graal/manifest.json
          grep -Fq '"guest_owner_threads_per_context": 5' app/generated/graal/manifest.json
          grep -Fq '"execution_concurrency_per_context": 5' app/generated/graal/manifest.json
          grep -Fq '"max_admitted_in_flight_per_isolate": 5' app/generated/graal/manifest.json
          grep -Fq '"engine_scope": "process-shared"' app/generated/graal/manifest.json
          ! grep -R -E 'config/environment|Rails\.application|ActionController|ActionView' app/generated/graal
          ! grep -R -F 'require "json"' app/generated/graal
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: '21'
          cache: maven
      - name: Prove GraalWorker route/group isolation and five-thread Context execution
        run: mvn -Dapp.root="$GITHUB_WORKSPACE/app" test
      - name: Package GraalWorker supervisor
        run: mvn -DskipTests package

  ruby-native-isolate-upstream-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: '25'
      - name: Keep Ruby Polyglot Native Isolates fail-closed until upstream ships them
        run: |
          if mvn -q dependency:get -Dartifact=org.graalvm.polyglot:ruby-isolate-linux-amd64-community:25.2.4:pom; then
            echo 'Ruby native-isolate artifact now exists; enable spawnIsolate(true) and replace this blocker assertion.'
            exit 1
          fi
          echo 'Expected upstream gap confirmed: use the TruffleRuby/GraalVM JVM worker-cell isolation model.'
