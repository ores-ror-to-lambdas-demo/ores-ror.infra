name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graal-lambda-worker-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: infra }
      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.rb
          ref: main
          path: app
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: false
          working-directory: app
      - name: Install Rails-free TruffleRuby worker bundle
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-truffleruby
          BUNDLE_WITHOUT: rails:test
        run: |
          bundle install --jobs 4 --retry 3
          ruby -e 'abort "Rails gem leaked into Graal worker bundle" unless Gem::Specification.find_all_by_name("rails").empty?'
      - name: Verify committed URL-shaped route sources and generate worker wrappers
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-truffleruby
          BUNDLE_WITHOUT: rails:test
          ORES_BUILD_TARGET: lambda
          ORES_LAMBDA_HANDLER_GRANULARITY: route
        run: |
          test -f 'routes/users/[id]/handler.rb'
          test -f 'routes/orders/[id]/handler.rb'
          test -f 'routes/orders/[id]/cancel/handler.rb'
          test -f 'routes/profiles/[id]/preferences/handler.rb'
          test "$(find routes -name handler.rb | wc -l)" -eq 13
          git ls-files | grep -Fx 'routes/users/[id]/handler.rb'
          git ls-files | grep -Fx 'routes/orders/[id]/cancel/handler.rb'

          bundle exec ruby bin/build-runtime

          test -f generated/lambda/entrypoint.rb
          test -f 'generated/lambda/routes/users/[id]/handler.rb'
          test -f 'generated/lambda/routes/orders/[id]/cancel/handler.rb'
          grep -Fq 'OresApp::RouteHandlers.call' 'generated/lambda/routes/users/[id]/handler.rb'
          grep -Fq '"source_handler": "routes/users/[id]/handler.rb"' generated/lambda/manifest.json
          grep -Fq '"source_handler": "routes/orders/[id]/cancel/handler.rb"' generated/lambda/manifest.json
          ! grep -R -E 'config/environment|Rails\.application' generated/lambda graal/bootstrap.rb routes
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '21'
          cache: maven
      - name: Build and test 2-cell / 6-worker Rails-free Graal cluster
        env:
          ORES_BUILD_TARGET: lambda
        run: mvn -f infra/pom.xml -Dapp.root="$GITHUB_WORKSPACE/app" test
      - name: Package runnable supervisor
        run: mvn -f infra/pom.xml -DskipTests package
      - name: Boot real Graal worker cluster and smoke HTTP
        env:
          APP_ROOT: ${{ github.workspace }}/app
          ORES_BUILD_TARGET: lambda
          PORT: '3200'
          MIN_ISOLATES: '2'
          MAX_ISOLATES: '3'
          ISOLATE_MAX_CONCURRENCY: '3'
          DATA_API_URL: http://127.0.0.1:8787/v1
        run: |
          java -jar infra/target/ores-ror-infra-0.3.0.jar >graal-cluster.log 2>&1 &
          echo $! > graal.pid
          for n in $(seq 1 90); do
            if curl --fail --silent -H 'x-request-id: graal-health' http://127.0.0.1:3200/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"runtime":"truffleruby-graal-lambda"' health.json
          grep -q '"execution_mode":"lambda"' health.json
          grep -q '"request_id":"graal-health"' health.json
          seq 1 24 | xargs -P 12 -I{} curl --fail --silent -H 'x-request-id: smoke-{}' http://127.0.0.1:3200/healthz >/dev/null
          kill $(cat graal.pid)
      - name: Show cluster log on failure
        if: failure()
        run: cat graal-cluster.log || true

  ruby-native-isolate-upstream-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Keep Ruby Polyglot Native Isolates fail-closed until upstream ships them
        run: |
          if mvn -q dependency:get -Dartifact=org.graalvm.polyglot:ruby-isolate-linux-amd64-community:25.2.4:pom; then
            echo 'Ruby native-isolate artifact now exists; enable spawnIsolate(true) and replace this blocker assertion.'
            exit 1
          fi
          echo 'Expected upstream gap confirmed: use the TruffleRuby/GraalVM JVM worker-cell isolation model.'
