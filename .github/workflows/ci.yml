name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graal-isolate-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: infra
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.rb
          ref: d0ae56d04e1f4c622c9dc39504d52abc908a3a23
          path: app
          persist-credentials: false

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: false
          working-directory: app

      - name: Prove Rails is absent from Graal generation
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-runtime
          BUNDLE_WITHOUT: rails:test
        run: |
          bundle install --jobs 4 --retry 3
          truffleruby -e 'abort "Rails gem leaked into worker bundle" unless Gem::Specification.find_all_by_name("rails").empty?; abort "Rails constant loaded" if defined?(Rails)'

      - name: Generate Graal route/group units without Rails
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-runtime
          BUNDLE_WITHOUT: rails:test
          ORES_BUILD_TARGET: graal
        run: |
          truffleruby bin/build-runtime
          test -f generated/graal/common.rb
          test -f 'generated/graal/routes/healthz/_get/handler.rb'
          test -f generated/graal/groups/healthz/handler.rb
          grep -Fq '"rails_boot": false' generated/graal/manifest.json
          grep -Fq '"contexts_per_isolate": 1' generated/graal/manifest.json
          grep -Fq '"host_thread_pool_size_per_context": 5' generated/graal/manifest.json
          grep -Fq '"request_multiplexing": true' generated/graal/manifest.json
          ! grep -R -E 'config/environment|Rails\.application' generated/graal
          truffleruby -e 'abort "Rails constant loaded during codegen" if defined?(Rails)'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: graalvm
          java-version: '21'
          cache: maven

      - name: Build and test one-Context-per-isolate cluster
        run: mvn -f infra/pom.xml -Dapp.root="$GITHUB_WORKSPACE/app" test

      - name: Package runnable supervisor
        run: mvn -f infra/pom.xml -DskipTests package

      - name: Boot real Graal isolate cluster and smoke HTTP
        env:
          APP_ROOT: ${{ github.workspace }}/app
          GRAAL_UNIT: routes/healthz/_get/handler.rb
          PORT: '3200'
          MIN_ISOLATES: '2'
          MAX_ISOLATES: '3'
          ISOLATE_MAX_CONCURRENCY: '3'
          REQUEST_TIMEOUT_SECONDS: '15'
          DATA_API_URL: http://127.0.0.1:8787/v1
        run: |
          java -jar infra/target/ores-ror-infra-0.3.0.jar >graal-cluster.log 2>&1 &
          echo $! > graal.pid
          cleanup() { kill "$(cat graal.pid)" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for n in $(seq 1 90); do
            if curl --fail --silent -H 'x-request-id: graal-health' http://127.0.0.1:3200/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"runtime":"truffleruby-graal-lambda"' health.json
          grep -q '"execution_mode":"graal"' health.json
          grep -q '"request_id":"graal-health"' health.json
          seq 1 60 | xargs -P 20 -I{} curl --fail --silent -H 'x-request-id: smoke-{}' http://127.0.0.1:3200/healthz >/dev/null

      - name: Show cluster log on failure
        if: failure()
        run: cat graal-cluster.log || true

  ruby-native-isolate-upstream-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: graalvm
          java-version: '25'
      - name: Keep Ruby Polyglot Native Isolates fail-closed until upstream ships them
        run: |
          if mvn -q dependency:get -Dartifact=org.graalvm.polyglot:ruby-isolate-linux-amd64-community:25.2.4:pom; then
            echo 'Ruby native-isolate artifact now exists; enable spawnIsolate(true) and replace this blocker assertion.'
            exit 1
          fi
          echo 'Expected upstream gap confirmed: use the TruffleRuby/GraalVM JVM Context isolation model.'
