name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  graal-lambda-worker-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: infra }

      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.rb
          ref: feat/colocated-rails-endpoint-handlers
          path: app

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: false
          working-directory: app

      - name: Install Rails codegen bundle
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-codegen
        run: bundle install --jobs 4 --retry 3

      - name: Generate co-located handlers from Rails conventions
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-codegen
          RAILS_ENV: test
          ORES_BUILD_TARGET: lambda
          ORES_LAMBDA_HANDLER_GRANULARITY: route
        run: |
          bundle exec ruby bin/build-runtime
          test -f generated/lambda/entrypoint.rb
          test -f generated/lambda/routes.rb
          test -f app/controllers/users/show/endpoint_controller.rb
          test -f app/controllers/users/show/handler.rb
          test -f app/controllers/orders/cancel/endpoint_controller.rb
          test -f app/controllers/orders/cancel/handler.rb
          test ! -d routes
          git check-ignore -q app/controllers/users/show/handler.rb
          grep -Fq '"route_source": "Rails.application.routes"' generated/lambda/manifest.json
          grep -Fq '"controller": "users/show/endpoint"' generated/lambda/manifest.json
          grep -Fq '"action": "show"' generated/lambda/manifest.json
          ! find generated/lambda -name '*.rb' -print0 | xargs -0 grep -E 'config/environment|Rails\.application'
          ! find app/controllers -name handler.rb -print0 | xargs -0 grep -E 'config/environment|Rails\.application'

      - name: Install and prove Rails-free worker bundle
        working-directory: app
        env:
          BUNDLE_PATH: vendor/bundle-runtime
          BUNDLE_WITHOUT: rails:test
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec ruby -e 'abort "Rails gem leaked into worker bundle" unless Gem::Specification.find_all_by_name("rails").empty?; abort "Rails constant loaded" if defined?(Rails)'

      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '21'
          cache: maven

      - name: Build and test Rails-free Graal cluster
        env:
          ORES_BUILD_TARGET: lambda
        run: mvn -f infra/pom.xml -Dapp.root="$GITHUB_WORKSPACE/app" test

      - name: Package runnable supervisor
        run: mvn -f infra/pom.xml -DskipTests package

      - name: Boot real Graal worker cluster and smoke HTTP
        env:
          APP_ROOT: ${{ github.workspace }}/app
          ORES_BUILD_TARGET: lambda
          PORT: '3200'
          MIN_ISOLATES: '2'
          MAX_ISOLATES: '3'
          ISOLATE_MAX_CONCURRENCY: '3'
          DATA_API_URL: http://127.0.0.1:8787/v1
        run: |
          java -jar infra/target/ores-ror-infra-0.3.0.jar >graal-cluster.log 2>&1 &
          echo $! > graal.pid
          for n in $(seq 1 90); do
            if curl --fail --silent -H 'x-request-id: graal-health' http://127.0.0.1:3200/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"runtime":"truffleruby-graal-lambda"' health.json
          grep -q '"execution_mode":"lambda"' health.json
          grep -q '"request_id":"graal-health"' health.json
          seq 1 24 | xargs -P 12 -I{} curl --fail --silent -H 'x-request-id: smoke-{}' http://127.0.0.1:3200/healthz >/dev/null
          kill $(cat graal.pid)

      - name: Show cluster log on failure
        if: failure()
        run: cat graal-cluster.log || true

  ruby-native-isolate-upstream-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Keep Ruby Polyglot Native Isolates fail-closed until upstream ships them
        run: |
          if mvn -q dependency:get -Dartifact=org.graalvm.polyglot:ruby-isolate-linux-amd64-community:25.2.4:pom; then
            echo 'Ruby native-isolate artifact now exists; enable spawnIsolate(true) and replace this blocker assertion.'
            exit 1
          fi
          echo 'Expected upstream gap confirmed: use the TruffleRuby/GraalVM JVM worker-cell isolation model.'
